<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Espace restaurant</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="adm">
  <form id="login" class="adm-login" hidden>
    <h1>Espace restaurant</h1>
    <label class="fld"><span>Adresse email</span><input name="email" type="email" required autocomplete="username"></label>
    <label class="fld"><span>Mot de passe</span><input name="password" type="password" required autocomplete="current-password"></label>
    <p id="login-err" class="err" role="alert" hidden></p>
    <button class="btn block" type="submit">Se connecter</button>
  </form>

  <div id="app" class="wrap" hidden>
    <div class="adm-top">
      <h1>Espace restaurant</h1>
      <div class="adm-tools">
        <button class="ghost" id="sound" type="button" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="/icons.svg#i-mute"/></svg><span>Son désactivé</span></button>
        <button class="ghost" id="logout" type="button"><svg class="i" aria-hidden="true"><use href="/icons.svg#i-logout"/></svg><span>Quitter</span></button>
      </div>
    </div>
    <div class="chips" role="tablist">
      <button role="tab" data-view="actives" aria-selected="true">En cours <span id="n-actives"></span></button>
      <button role="tab" data-view="done" aria-selected="false">Terminées</button>
      <button role="tab" data-view="menu" aria-selected="false">Menu et prix</button>
    </div>
    <div id="orders" class="orders"></div>
    <div id="products" hidden></div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/admin.js"></script>
</body>
</html>
